[project]
name = "opnsense-python"
version = "0.0.2"
description = ""
authors = [
  { name = "Kojiro ONO", email = "ono.kojiro@gmail.com" }
]

readme = "README.md"

dependencies = [
  "python-dotenv>=1.2.2",
  "requests>=2.34.2",
  "pyyaml>=6.0.3",
]

[project.optional-dependencies]
dev = [
  "build>=1.4.0",
  "pytest>=9.0.3",
  "pytest-order>=1.3.0",
  "anyio>=4.15.1",
]

[tool.setuptools.packages]
find = { where = [ "src"] }

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project.scripts]
opncli = "opnsense.opncli:main"

