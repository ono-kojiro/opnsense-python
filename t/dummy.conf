config firewall address

    edit "alias_nw_wan"
        set subnet 172.16.0.0 255.255.255.0
        set comment "Alias of WAN Network"
    next

    edit "alias_nw_opt1"
        set subnet 172.16.1.0 255.255.255.0
        set comment "Alias of OPT1 Network"
    next

    edit "alias_nw_opt2"
        set subnet 172.16.2.0 255.255.255.0
        set comment "Alias of OPT2 Network"
    next

    edit "alias_nw_opt3"
        set subnet 172.16.3.0 255.255.255.0
        set comment "Alias of OPT3 Network"
    next

    edit "alias_nw_opt4"
        set subnet 172.16.4.0 255.255.255.0
        set comment "Alias of OPT4 Network"
    next

    edit "alias_nw_192_168_1_0__24"
        set subnet 192.168.1.0 255.255.255.0
        set comment "Alias of Network"
    next

    edit "host_ldapserver"
        set subnet 192.168.1.72 255.255.255.255
        set comment "Alias of LDAP Server"
    next

    edit "net_192_168_42_0_24"
        set subnet 192.168.42.0 255.255.255.0
    next

    edit "net_192_168_13_0_24"
        set subnet 192.168.13.0 255.255.255.0
    next

end

config firewall service custom

    edit "port_1234"
        set tcp-portrange 1234
        set comment "Alias of port 1234"
    next

    edit "port_9999"
        set tcp-portrange 9999
    next

end

config firewall policy

    edit 1
        set name "LDAP_Test"
        set srcintf "wan"
        set dstintf "lan"
        set srcaddr "alias_nw_wan"
        set dstaddr "host_ldapserver"
        set action accept
        set schedule "always"
        set service "port_1234"
        set logtraffic all
        set comments "Test policy for alias migration"
    next

    edit 101
        set name "allow connection from opt1 to wan"
        set srcintf "opt1"
        set dstintf "wan"
        set srcaddr "alias_nw_opt1"
        set dstaddr "alias_nw_wan"
        set action accept
        set schedule "always"
        set service "ALL"
        set logtraffic all
    next

    edit 102
        set name "allow connection from opt2 to wan"
        set srcintf "opt2"
        set dstintf "wan"
        set srcaddr "alias_nw_opt2"
        set dstaddr "alias_nw_wan"
        set action accept
        set schedule "always"
        set service "ALL"
        set logtraffic all
    next

    edit 103
        set name "allow connection from opt3 to wan"
        set srcintf "opt3"
        set dstintf "wan"
        set srcaddr "alias_nw_opt3"
        set dstaddr "alias_nw_wan"
        set action accept
        set schedule "always"
        set service "ALL"
        set logtraffic all
    next

    edit 104
        set name "allow connection from opt4 to wan"
        set srcintf "opt4"
        set dstintf "wan"
        set srcaddr "alias_nw_opt4"
        set dstaddr "alias_nw_wan"
        set action accept
        set schedule "always"
        set service "ALL"
        set logtraffic all
    next

    edit 200
        set name "allow VIP connection from opt2"
        set srcintf "opt2"
        set dstintf "opt1"
        set srcaddr "net_192_168_42_0_24"
        set dstaddr "net_192_168_13_0_24"
        set action accept
        set schedule "always"
        set service "port_9999"
        set logtraffic all
    next

    edit 301
        set name "allow ICMP from opt1 to wan"
        set srcintf "opt1"
        set dstintf "wan"
        set srcaddr "alias_nw_opt1"
        set dstaddr "alias_nw_wan"
        set action accept
        set schedule "always"
        set service "PING"
        set logtraffic all
    next

end

