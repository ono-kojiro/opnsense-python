---
filters:
  - description: allow ICMP from opt1 to inet
    categories: red
    action: pass
    interface: opt1
    direction: in
    ipprotocol: inet
    protocol: ICMP
    source_net: alias_nw_opt1
    destination_net: alias_nw_inet
    enabled: 1
    quick: 1
    statetype: keep
    sequence: 301

  - description: allow connection from opt1 to inet
    categories: red
    action: pass
    interface: opt1
    direction: in
    ipprotocol: inet
    protocol: TCP
    source_net: alias_nw_opt1
    destination_net: alias_nw_inet
    destination_port: any
    enabled: 1
    quick: 1
    statetype: keep
    sequence: 101
  
