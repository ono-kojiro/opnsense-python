---
services:
  inetterm:
    image: ${IMAGE}
    container_name: inetterm
    hostname: inetterm
    restart: always
    stdin_open: true
    tty: true

    cap_add:
    - NET_ADMIN

    environment:
      TZ: ${TIMEZONE}
      LDAP_URI: ${LDAP_URI}
      LDAP_BASE: ${LDAP_BASE}
      LDAP_START_TLS: ${LDAP_START_TLS}
      LDAP_TLS_REQCERT: ${LDAP_TLS_REQCERT}
      LDAP_ALLOW_GROUPS: ${LDAP_ALLOW_GROUPS}

    networks:
      inet:
        ipv4_address: 172.16.99.199
  
  opt1term:
    image: ${IMAGE}
    container_name: opt1term
    hostname: opt1term
    restart: always
